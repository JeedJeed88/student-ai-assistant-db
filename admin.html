<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>จัดการฐานความรู้</title><link rel="stylesheet" href="/style.css"></head><body><main class="shell admin"><header class="top"><div class="mark">DB</div><div><h1>จัดการฐานความรู้</h1><p>Admin Knowledge Base</p></div><a class="link" href="/">กลับหน้าแชต</a></header><section id="login" class="panel"><h2>เข้าสู่ระบบผู้ดูแล</h2><form id="login-form" class="stack"><input id="password" type="password" placeholder="รหัสผ่านผู้ดูแล" required><button>เข้าสู่ระบบ</button></form><p id="login-error" class="error"></p></section><section id="panel" class="panel hidden"><div class="panelhead"><h2>เพิ่มข้อมูลคำถาม-คำตอบ</h2><button id="logout" class="secondary">ออกจากระบบ</button></div><form id="entry-form" class="stack"><input id="category" placeholder="หมวดหมู่" value="ทั่วไป" required><input id="question" placeholder="คำถาม" required><textarea id="answer" rows="4" placeholder="คำตอบ" required></textarea><input id="keywords" placeholder="คำค้นเพิ่มเติม คั่นด้วยเว้นวรรค"><button>บันทึกข้อมูล</button></form><p id="notice" class="notice"></p><h2>ข้อมูลในระบบ</h2><div id="entries" class="entries"></div></section></main><script src="/admin.js"></script></body></html>
