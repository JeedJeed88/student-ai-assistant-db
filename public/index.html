<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student AI Assistant</title><link rel="stylesheet" href="/style.css"></head><body><main class="shell"><header class="top"><div class="mark">AI</div><div><h1>ผู้ช่วยข้อมูลนักเรียน</h1><p>Student AI Assistant</p></div><a class="link" href="/admin.html">ผู้ดูแลระบบ</a></header><section class="intro"><span class="dot"></span> พร้อมให้บริการ<h2>สวัสดีครับ 👋</h2><p>สอบถามข้อมูลตารางเรียน ค่าเล่าเรียน และข้อมูลของวิทยาลัยได้เลย</p></section><section id="chat" class="chat" aria-live="polite"><div class="bubble bot">สวัสดีครับ มีอะไรให้ช่วยสอบถามไหมครับ?</div></section><form id="form" class="composer"><input id="message" maxlength="1000" placeholder="พิมพ์คำถามของคุณ..." autocomplete="off" required><button id="send">ส่ง</button></form><p class="hint">คำตอบอ้างอิงจากฐานข้อมูลที่ผู้ดูแลเพิ่มไว้ หากไม่พบข้อมูล โปรดติดต่อเจ้าหน้าที่</p></main><script src="/app.js"></script></body></html>
